const BRL = (v) =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(
    Number.isFinite(v) ? v : 0
  );

function normKey(s) {
  return String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function pickByNorm(rawObj, patterns) {
  const norm = {};
  Object.keys(rawObj).forEach((k) => { norm[normKey(k)] = rawObj[k]; });
  for (const p of patterns) {
    if (norm[p] !== undefined) return norm[p];
  }
  const keys = Object.keys(norm);
  for (const p of patterns) {
    const found = keys.find((k) => k.startsWith(p));
    if (found !== undefined) return norm[found];
  }
  return "";
}

function sheetToProduct(row) {
  return {
    id: pickByNorm(row, ["id"]) || Math.random().toString(36),
    nome: String(pickByNorm(row, ["nome do produto", "nome"]) || ""),
    tamanho: String(pickByNorm(row, ["tamanho"]) || ""),
    categoria: String(pickByNorm(row, ["categoria"]) || ""),
    versao: String(pickByNorm(row, ["versao"]) || ""),
    campeonato: String(pickByNorm(row, ["campeonato", "liga"]) || ""),
    genero: String(pickByNorm(row, ["genero"]) || ""),
    temporada: String(pickByNorm(row, ["temporada"]) || ""),
    preco: Number(pickByNorm(row, ["preco de venda", "preco"])) || 0,
    estoque: Number(pickByNorm(row, ["estoque atual"])) || 0,
    imagens: String(pickByNorm(row, ["imagem", "imagens", "foto", "fotos"]) || "")
      .split(/\r?\n|,\s*(?=https?:\/\/)/)
      .map((s) => s.trim())
      .filter(Boolean),
  };
}

function sheetToEncomenda(row) {
  return {
    id: pickByNorm(row, ["id"]) || Math.random().toString(36),
    nome: String(pickByNorm(row, ["nome do produto", "nome"]) || ""),
    versao: String(pickByNorm(row, ["versao"]) || ""),
    temporada: String(pickByNorm(row, ["temporada"]) || ""),
    preco: Number(pickByNorm(row, ["preco de venda", "preco"])) || 0,
    imagens: String(pickByNorm(row, ["imagem", "imagens", "foto", "fotos"]) || "")
      .split(/\r?\n|,\s*(?=https?:\/\/)/)
      .map((s) => s.trim())
      .filter(Boolean),
  };
}

// Ordem em que os tamanhos aparecem no card. Qualquer tamanho fora desta
// lista vai para o fim, na ordem em que foi cadastrado.
const ORDEM_TAMANHOS = ["16", "18", "20", "22", "24", "26", "28", "P", "M", "G", "GG", "3G", "XGG", "XXG", "4G", "XXXG"];

function posicaoTamanho(t) {
  const i = ORDEM_TAMANHOS.indexOf(String(t || "").trim().toUpperCase());
  return i === -1 ? 999 : i;
}

// Produtos que só diferem pelo tamanho viram um card só. A chave ignora o
// tamanho justamente para juntá-los.
function chaveGrupo(p) {
  return normKey(
    [p.nome, p.versao, p.campeonato, p.genero, p.temporada, p.categoria, p.sobEncomenda ? "enc" : "est"].join("|")
  );
}

function agruparPorTamanho(lista) {
  const mapa = new Map();
  lista.forEach((p) => {
    const k = chaveGrupo(p);
    if (!mapa.has(k)) mapa.set(k, { id: k, base: p, sobEncomenda: !!p.sobEncomenda, variantes: [] });
    mapa.get(k).variantes.push(p);
  });
  return Array.from(mapa.values())
    .map((g) => ({
      ...g,
      variantes: g.variantes.slice().sort((a, b) => posicaoTamanho(a.tamanho) - posicaoTamanho(b.tamanho)),
    }))
    // um modelo só aparece se ainda houver ao menos um tamanho em estoque
    .filter((g) => g.sobEncomenda || g.variantes.some((v) => Number(v.estoque) > 0));
}

// Abas de categoria. Cada uma casa com o conteúdo da coluna "Categoria"
// do produto, ignorando acentos e maiúsculas — assim "Bone", "boné" e
// "Bonés" caem todos na mesma aba.
const CATEGORIAS = [
  { id: "todos", rotulo: "Todos", termos: [] },
  { id: "futebol", rotulo: "Futebol", termos: ["futebol"] },
  { id: "nba", rotulo: "NBA", termos: ["nba", "basquete"] },
  { id: "bone", rotulo: "Boné", termos: ["bone"] },
  { id: "perfume", rotulo: "Perfume", termos: ["perfume"] },
];

function combinaCategoria(produto, idCategoria) {
  if (idCategoria === "todos") return true;
  const alvo = CATEGORIAS.find((x) => x.id === idCategoria);
  if (!alvo) return true;
  // olhamos categoria e nome, para pegar casos em que o tipo do item
  // só aparece no nome do produto
  const texto = normKey(`${produto.categoria || ""} ${produto.nome || ""}`);
  return alvo.termos.some((t) => texto.includes(t));
}

  );
  const itensSobEncomenda = useMemo(
    () => encomendas.map((e) => ({ ...e, sobEncomenda: true, estoque: 0, tamanho: "", categoria: "", campeonato: "", genero: "" })),
    [encomendas]
  );
  const disponiveis = view === "encomenda" ? itensSobEncomenda : produtosDisponiveis;

  const filtrados = useMemo(() => {
    const q = search.trim().toLowerCase();
    return disponiveis.filter((p) => {
      if (!combinaCategoria(p, categoria)) return false;
      if (!q) return true;
      return (
        p.nome.toLowerCase().includes(q) ||
        (p.categoria || "").toLowerCase().includes(q) ||
        (p.campeonato || "").toLowerCase().includes(q) ||
        (p.temporada || "").toLowerCase().includes(q)
      );
    });
  }, [disponiveis, search, categoria]);

  const grupos = useMemo(() => agruparPorTamanho(filtrados), [filtrados]);
  // Base agrupada só para os contadores das abas: conta modelos (cards),
  // não linhas da planilha, e já ignora o que está totalmente esgotado.
  const gruposBase = useMemo(() => agruparPorTamanho(disponiveis), [disponiveis]);

  // Tamanho escolhido em cada card (por id de grupo)
  const [escolhas, setEscolhas] = useState({});
  function varianteDe(grupo) {
    const escolhido = escolhas[grupo.id];
    return (
      grupo.variantes.find((v) => v.id === escolhido) ||
      grupo.variantes.find((v) => Number(v.estoque) > 0) ||
      grupo.variantes[0]
    );
  }

  function metaLineCatalogo(p) {
    if (p.sobEncomenda) return [p.versao, p.temporada].filter(Boolean).join(" · ");
    return [p.versao, p.campeonato, p.genero, p.temporada].filter(Boolean).join(" · ");
  }

  function irPara(passo) {
    setLightbox((lb) => {
      if (!lb) return lb;
      const total = lb.produto.imagens.length;
      return { ...lb, indice: (lb.indice + passo + total) % total };
    });
  }

  useEffect(() => {
    if (!lightbox) return;
    function tecla(e) {
      if (e.key === "Escape") setLightbox(null);
      if (e.key === "ArrowRight") irPara(1);
      if (e.key === "ArrowLeft") irPara(-1);
    }
    window.addEventListener("keydown", tecla);
    return () => window.removeEventListener("keydown", tecla);
  }, [lightbox]);

  function pedirNoWhatsapp(p) {
    if (!WHATSAPP_NUMERO) return;
    const texto = `Olá! Tenho interesse em: ${p.nome}${p.tamanho ? " (" + p.tamanho + ")" : ""} — ${BRL(p.preco)}`;
    window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`, "_blank");
  }

  return (
    <div className="cat-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
        .cat-root {
          --paper: #0E0C09; --panel: #18150F; --panel2: #211C13;
          --ink: #F5F0E1; --ink-soft: #A99C7C; --line: #3A311E;
          --rust: #D9A93B; --rust-dark: #B8862A;
          --sage: #6FBE8C; --sage-bg: #16281F;
          --danger: #C0392B;
          font-family: 'IBM Plex Sans', sans-serif;
          background: var(--paper); color: var(--ink);
          min-height: 100vh; padding: 24px 16px 60px;
        }
        .cat-root * { box-sizing: border-box; }
        .spin { animation: cat-spin 0.9s linear infinite; }
        @keyframes cat-spin { to { transform: rotate(360deg); } }
        .cat-wrap { max-width: 1100px; margin: 0 auto; }
        .cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .cat-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
        .cat-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
        .cat-search { position: relative; margin-bottom: 20px; }
        .cat-search input {
          width: 100%; padding: 11px 14px 11px 38px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); font-size: 15px; font-family: inherit;
        }
        .cat-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 14px; }
        .cat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .cat-card-img { aspect-ratio: 4/3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); overflow: hidden; position: relative; }
        .cat-card-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .cat-photo-count { position: absolute; bottom: 6px; right: 6px; background: rgba(14,12,9,0.75); color: var(--ink); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; }
        .cat-card-body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .cat-card-name { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
        .cat-size-tag { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 1px 7px; border: 1px solid var(--rust); color: var(--rust); border-radius: 6px; font-size: 11px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; margin-left: 6px; }
        .cat-card-cat { font-size: 12px; color: var(--ink-soft); }
        .cat-card-meta { font-size: 11px; color: var(--ink-soft); opacity: 0.85; }
        .cat-price { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 15.5px; margin-top: 2px; }
        .cat-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-block; width: fit-content; }
        .cat-badge-ok { background: var(--sage-bg); color: var(--sage); }
        .cat-badge-encomenda { background: rgba(217,169,59,0.15); color: var(--rust); }
        .cat-wa-btn {
          margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px;
          background: var(--rust); color: #17130B; border: none; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .cat-wa-btn:hover { background: var(--rust-dark); }
        .cat-empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
        .cat-loading { display: flex; align-items: center; justify-content: center; height: 300px; color: var(--ink-soft); gap: 8px; }
        .cat-erro { text-align: center; padding: 40px 20px; color: var(--danger); }
        .cat-toggle { display: flex; gap: 6px; background: var(--panel); padding: 4px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 16px; max-width: 360px; }
        .cat-toggle button { flex: 1; padding: 9px 6px; border: none; background: transparent; border-radius: 7px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink-soft); font-family: inherit; }
        .cat-toggle button.active { background: var(--sage-bg); color: var(--sage); }
        .cat-cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
        .cat-cats::-webkit-scrollbar { display: none; }
        .cat-cats button {
          flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
          padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink-soft); font-size: 13.5px; font-weight: 500;
          font-family: inherit; cursor: pointer; white-space: nowrap;
        }
        .cat-cats button.on { background: var(--rust); border-color: var(--rust); color: #17130B; font-weight: 600; }
        .cat-cats-qtd { font-size: 11px; opacity: 0.7; font-family: 'IBM Plex Mono', monospace; }
        .cat-tamanhos { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
        .cat-tamanhos button {
          min-width: 36px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--panel2); color: var(--ink-soft); font-size: 13px; font-weight: 600;
          font-family: 'IBM Plex Mono', monospace; cursor: pointer;
        }
        .cat-tamanhos button.on { background: var(--rust); border-color: var(--rust); color: #17130B; }
        .cat-tamanhos button.off { opacity: 0.32; background: transparent; border-style: dashed; text-decoration: line-through; cursor: not-allowed; }
        .cat-card-img.clicavel { cursor: pointer; }
        .cat-photo-count { display: flex; align-items: center; gap: 3px; }
        .cat-lb {
          position: fixed; inset: 0; background: rgba(6,5,4,0.94); z-index: 100;
          display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
        }
        .cat-lb-fechar {
          position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
          border: 1px solid var(--line); background: rgba(24,21,15,0.9); color: var(--ink);
          display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;
        }
        .cat-lb-palco { position: relative; width: 100%; max-width: 620px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
        .cat-lb-palco img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; display: block; }
        .cat-lb-nav {
          position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
          border: 1px solid var(--line); background: rgba(24,21,15,0.85); color: var(--ink);
          font-size: 28px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 4px;
        }
        .cat-lb-nav.esq { left: 4px; }
        .cat-lb-nav.dir { right: 4px; }
        .cat-lb-info { width: 100%; max-width: 620px; text-align: center; padding: 14px 4px 4px; }
        .cat-lb-nome { font-weight: 600; font-size: 15.5px; color: var(--ink); }
        .cat-lb-preco { font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: var(--rust); margin-top: 3px; }
        .cat-lb-pontos { display: flex; justify-content: center; gap: 7px; margin: 12px 0 4px; }
        .cat-lb-pontos span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); cursor: pointer; }
        .cat-lb-pontos span.on { background: var(--rust); }
        .cat-lb-info .cat-wa-btn { margin-top: 12px; }
        @media (min-width: 700px) and (pointer: coarse) {
          .cat-lb-fechar { width: 11vw; height: 11vw; }
          .cat-lb-nav { width: 12vw; height: 12vw; font-size: 7vw; }
          .cat-lb-nome { font-size: 4vw; }
          .cat-lb-preco { font-size: 4.4vw; }
          .cat-lb-pontos span { width: 2.2vw; height: 2.2vw; }
          .cat-cats button { font-size: 3.4vw; padding: 2.2vw 3.8vw; }
          .cat-cats-qtd { font-size: 2.8vw; }
          .cat-tamanhos button { font-size: 3.4vw; padding: 1.8vw 3vw; min-width: 9vw; }
        }
      `}</style>
      <div className="cat-wrap">
        <div className="cat-header">
          <img src={LOGO} alt="1971 Sportswear" style={{ width: 44, height: 44, borderRadius: "50%", flexShrink: 0 }} />
          <h1 className="cat-title">Catálogo</h1>
        </div>

        {!loaded ? (
          <div className="cat-loading"><Loader2 className="spin" size={20} /> Carregando produtos…</div>
        ) : erro ? (
          <div className="cat-erro">Não consegui carregar o catálogo agora. Tente atualizar a página.</div>
        ) : (
          <>
            <div className="cat-toggle">
              <button type="button" className={view === "disponivel" ? "active" : ""} onClick={() => setView("disponivel")}>Disponível</button>
              <button type="button" className={view === "encomenda" ? "active" : ""} onClick={() => setView("encomenda")}>Sob encomenda</button>
            </div>
            <div className="cat-search">
              <Search size={16} />
              <input placeholder="Buscar por time, campeonato…" value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>

            <div className="cat-cats">
              {CATEGORIAS.map((cat) => {
                const qtd = cat.id === "todos"
                  ? gruposBase.length
                  : gruposBase.filter((g) => combinaCategoria(g.base, cat.id)).length;
                if (qtd === 0 && cat.id !== "todos" && categoria !== cat.id) return null;
                return (
                  <button
                    key={cat.id}
                    type="button"
                    className={categoria === cat.id ? "on" : ""}
                    onClick={() => setCategoria(cat.id)}
                  >
                    {cat.rotulo} <span className="cat-cats-qtd">{qtd}</span>
                  </button>
                );
              })}
            </div>

            {filtrados.length === 0 ? (
              <div className="cat-empty">
                <ShoppingBag size={30} style={{ marginBottom: 10, opacity: 0.5 }} />
                <div>{gruposBase.length === 0 ? (view === "encomenda" ? "Nenhum item sob encomenda no momento." : "Nenhum produto disponível no momento.") : "Nada encontrado nessa categoria ou busca."}</div>
              </div>
            ) : (
              <div className="cat-grid">
                {grupos.map((g) => {
                  // A variante escolhida define foto, preço e estoque exibidos.
                  const p = varianteDe(g);
                  // Fotos: usa as do tamanho escolhido; se ele não tiver foto,
                  // aproveita as de outro tamanho do mesmo modelo.
                  const fotos = (p.imagens && p.imagens.length)
                    ? p.imagens
                    : (g.variantes.find((v) => v.imagens && v.imagens.length)?.imagens || []);
                  const temVariosTamanhos = g.variantes.length > 1 || (g.variantes[0] && g.variantes[0].tamanho);

                  return (
                    <div className="cat-card" key={g.id}>
                      <div
                        className={`cat-card-img ${fotos.length ? "clicavel" : ""}`}
                        onClick={() => fotos.length && setLightbox({ produto: { ...p, imagens: fotos }, indice: 0 })}
                      >
                        {fotos[0] ? (
                          <>
                            <img src={fotos[0]} alt={p.nome} />
                            {fotos.length > 1 && (
                              <span className="cat-photo-count">
                                <Images size={11} /> {fotos.length}
                              </span>
                            )}
                          </>
                        ) : <ImagePlus size={26} />}
                      </div>
                      <div className="cat-card-body">
                        <div className="cat-card-name">{p.nome}</div>
                        {!p.sobEncomenda && p.categoria && <div className="cat-card-cat">{p.categoria}</div>}
                        {metaLineCatalogo(p) && <div className="cat-card-meta">{metaLineCatalogo(p)}</div>}

                        {!p.sobEncomenda && temVariosTamanhos && (
                          <div className="cat-tamanhos">
                            {g.variantes.map((v) => {
                              const semEstoque = Number(v.estoque) <= 0;
                              return (
                                <button
                                  key={v.id}
                                  type="button"
                                  disabled={semEstoque}
                                  title={semEstoque ? "Esgotado" : ""}
                                  className={`${v.id === p.id ? "on" : ""} ${semEstoque ? "off" : ""}`}
                                  onClick={() => !semEstoque && setEscolhas((e) => ({ ...e, [g.id]: v.id }))}
                                >
                                  {v.tamanho || "Único"}
                                </button>
                              );
                            })}
                          </div>
                        )}

                        <div className="cat-price">{BRL(p.preco)}</div>
                        {p.sobEncomenda ? (
                          <span className="cat-badge cat-badge-encomenda">Sob encomenda</span>
                        ) : (
                          <span className="cat-badge cat-badge-ok">
                            {p.estoque} disponível(is){p.tamanho ? ` no ${p.tamanho}` : ""}
                          </span>
                        )}
                        {WHATSAPP_NUMERO && (
                          <button className="cat-wa-btn" onClick={() => pedirNoWhatsapp(p)}>
                            <MessageCircle size={14} /> Pedir pelo WhatsApp
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        )}
      </div>

      {lightbox && (
        <div className="cat-lb" onClick={() => setLightbox(null)}>
          <button className="cat-lb-fechar" onClick={() => setLightbox(null)} aria-label="Fechar">
            <X size={22} />
          </button>

          <div
            className="cat-lb-palco"
            onClick={(e) => e.stopPropagation()}
            onTouchStart={(e) => { toqueX.current = e.touches[0].clientX; }}
            onTouchEnd={(e) => {
              if (toqueX.current === null) return;
              const dif = e.changedTouches[0].clientX - toqueX.current;
              if (dif < -45) irPara(1);
              else if (dif > 45) irPara(-1);
              toqueX.current = null;
            }}
          >
            <img src={lightbox.produto.imagens[lightbox.indice]} alt={lightbox.produto.nome} />

            {lightbox.produto.imagens.length > 1 && (
              <>
                <button className="cat-lb-nav esq" onClick={() => irPara(-1)} aria-label="Anterior">‹</button>
                <button className="cat-lb-nav dir" onClick={() => irPara(1)} aria-label="Próxima">›</button>
              </>
            )}
          </div>

          <div className="cat-lb-info" onClick={(e) => e.stopPropagation()}>
            <div className="cat-lb-nome">{lightbox.produto.nome}</div>
            <div className="cat-lb-preco">{BRL(lightbox.produto.preco)}</div>
            {lightbox.produto.imagens.length > 1 && (
              <div className="cat-lb-pontos">
                {lightbox.produto.imagens.map((_, i) => (
                  <span
                    key={i}
                    className={i === lightbox.indice ? "on" : ""}
                    onClick={() => setLightbox((lb) => ({ ...lb, indice: i }))}
                  />
                ))}
              </div>
            )}
            {WHATSAPP_NUMERO && (
              <button className="cat-wa-btn" onClick={() => pedirNoWhatsapp(lightbox.produto)}>
                <MessageCircle size={14} /> Pedir pelo WhatsApp
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CatalogoPublico />);
</script>

<script>
  (function () {
    var source = document.getElementById("jsx-src").textContent;
    try {
      var compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(compiled);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div class="boot-error">Erro ao carregar o catálogo:\n' + (err && err.message ? err.message : err) + '</div>';
      console.error(err);
    }
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (e) { console.log("SW não registrado:", e); });
    });
  }
</script>
</body>
</html>
