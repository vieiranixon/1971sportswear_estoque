function resizeImage(file, maxWidth = 680, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Ponte com a planilha (Google Apps Script) ----------
// A planilha do usuário tem cabeçalhos em português, às vezes com
// espaços/acentos variando ("Versão " / "Versão", "Genêro" / "Gênero",
// "Estoque Minímo" / "Mínimo"). Em vez de depender da grafia exata,
// normalizamos removendo acentos/espaços para casar os campos com segurança.
function normKey(s) {
  return String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function pickByNorm(rawObj, patterns) {
  const norm = {};
  Object.keys(rawObj).forEach((k) => { norm[normKey(k)] = rawObj[k]; });
  for (const p of patterns) {
    if (norm[p] !== undefined) return norm[p];
  }
  const keys = Object.keys(norm);
  for (const p of patterns) {
    const found = keys.find((k) => k.startsWith(p));
    if (found !== undefined) return norm[found];
  }
  return "";
}

// Converte uma linha crua vinda da planilha (chaves = cabeçalhos exatos)
// para o formato interno "limpo" que o app usa.
function parseBool_(v) {
  const s = String(v ?? "").trim().toLowerCase();
  return s === "sim" || s === "true" || s === "verdadeiro" || s === "1";
}

function sheetToProduct(row) {
  return {
    id: pickByNorm(row, ["id"]) || uid(),
    nome: String(pickByNorm(row, ["nome do produto", "nome"]) || ""),
    tamanho: String(pickByNorm(row, ["tamanho"]) || ""),
    categoria: String(pickByNorm(row, ["categoria"]) || ""),
    versao: String(pickByNorm(row, ["versao"]) || ""),
    campeonato: String(pickByNorm(row, ["campeonato", "liga"]) || ""),
    genero: String(pickByNorm(row, ["genero"]) || ""),
    temporada: String(pickByNorm(row, ["temporada"]) || ""),
    custo: Number(pickByNorm(row, ["custo"])) || 0,
    preco: Number(pickByNorm(row, ["preco de venda", "preco"])) || 0,
    estoque: Number(pickByNorm(row, ["estoque atual"])) || 0,
    estoqueMinimo: Number(pickByNorm(row, ["estoque minimo", "estoque min"])) || 0,
    imagens: String(pickByNorm(row, ["imagem", "imagens", "foto", "fotos"]) || "")
      .split(/\r?\n|,\s*(?=https?:\/\/)/)
      .map((s) => s.trim())
      .filter(Boolean),
    sobEncomenda: parseBool_(pickByNorm(row, ["sob encomenda"])),
  };
}

function sheetToMovement(row) {
  return {
    id: pickByNorm(row, ["id"]) || uid(),
    data: String(pickByNorm(row, ["data"]) || ""),
    produtoId: String(pickByNorm(row, ["produto id"]) || ""),
    produtoNome: String(pickByNorm(row, ["produto nome"]) || ""),
    tipo: String(pickByNorm(row, ["tipo"]) || "entrada"),
    quantidade: Number(pickByNorm(row, ["quantidade"])) || 0,
    observacao: String(pickByNorm(row, ["observacao"]) || ""),
  };
}

// Cabeçalhos de fallback (usados só se a planilha ainda não tiver
// nenhuma linha de produto, então não dá pra descobrir os nomes reais).
const FALLBACK_HEADERS = [
  "ID", "Nome do Produto", "Tamanho", "Categoria", "Versão", "Campeonato",
  "Genêro", "Temporada", "Custo (R$)", "Preço de Venda (R$)", "Estoque Atual", "Estoque Minímo",
  "Imagem", "Sob Encomenda",
];

// Converte o produto "limpo" de volta para o formato de linha da planilha,
// usando os cabeçalhos reais (descobertos na leitura) para casar cada campo.
function productToSheetRow(p, headers) {
  const data = {};
  headers.forEach((h) => {
    const n = normKey(h);
    if (n === "id") return; // ID vai separado no payload
    if (n.startsWith("nome")) data[h] = p.nome;
    else if (n.startsWith("tamanho")) data[h] = p.tamanho;
    else if (n.startsWith("categoria")) data[h] = p.categoria;
    else if (n.startsWith("versao")) data[h] = p.versao;
    else if (n.startsWith("campeonato") || n.startsWith("liga")) data[h] = p.campeonato;
    else if (n.startsWith("genero")) data[h] = p.genero;
    else if (n.startsWith("temporada")) data[h] = p.temporada;
    else if (n.startsWith("custo")) data[h] = p.custo;
    else if (n.startsWith("preco")) data[h] = p.preco;
    else if (n.startsWith("estoque min")) data[h] = p.estoqueMinimo;
    else if (n.startsWith("estoque")) data[h] = p.estoque;
    else if (n.startsWith("imagem") || n.startsWith("foto")) data[h] = (p.imagens || []).join("\n");
    else if (n.startsWith("sob encomenda")) data[h] = p.sobEncomenda ? "Sim" : "";
  });
  return data;
}

async function gasGet() {
  const res = await fetch(GAS_URL, { method: "GET" });
  if (!res.ok) throw new Error("Falha ao ler a planilha");
  return res.json();
}

async function gasPost(payload) {
  const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
  if (!res.ok) throw new Error("Falha ao gravar na planilha");
  return res.json();
}

const emptyProduct = {
  nome: "",
  tamanho: "",
  categoria: "",
  versao: "",
  campeonato: "",
  genero: "",
  temporada: "",
  custo: "",
  preco: "",
  estoque: "",
  estoqueMinimo: "",
  imagens: [],
  sobEncomenda: false,
};

function ControleEstoque() {
  const [tab, setTab] = useState("produtos");
  const [products, setProducts] = useState([]);
  const [movements, setMovements] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [offline, setOffline] = useState(false);
  const [toast, setToast] = useState(null);

  const [search, setSearch] = useState("");
  const [modalProduct, setModalProduct] = useState(null); // {} new or product to edit
  const [form, setForm] = useState(emptyProduct);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const [movForm, setMovForm] = useState({ produtoId: "", tipo: "entrada", quantidade: "", observacao: "" });
  const [importPending, setImportPending] = useState(null);

  const importRef = useRef(null);
  const fileRef = useRef(null);
  const headersRef = useRef(FALLBACK_HEADERS);
  const [uploadingImg, setUploadingImg] = useState(false);
  const [gerandoImagem, setGerandoImagem] = useState(false);
  const catalogRef = useRef(null);

  async function carregarDados(showSpinner) {
    if (showSpinner) setSyncing(true);
    try {
      const raw = await gasGet();
      const rawProducts = Array.isArray(raw.products) ? raw.products : [];
      const rawMovements = Array.isArray(raw.movements) ? raw.movements : [];
      if (rawProducts[0]) headersRef.current = Object.keys(rawProducts[0]);
      setProducts(rawProducts.map(sheetToProduct));
      setMovements(
        rawMovements
          .map(sheetToMovement)
          .sort((a, b) => new Date(b.data) - new Date(a.data))
      );
      setOffline(false);
    } catch (e) {
      setOffline(true);
      showToast("Não consegui falar com a planilha agora", "erro");
    } finally {
      setLoaded(true);
      setSyncing(false);
    }
  }

  useEffect(() => {
    carregarDados(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function showToast(msg, kind = "ok") {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2600);
  }

  const stats = useMemo(() => {
    const totalItens = products.reduce((s, p) => s + (Number(p.estoque) || 0), 0);
    const valorCusto = products.reduce((s, p) => s + (Number(p.estoque) || 0) * (Number(p.custo) || 0), 0);
    const valorVenda = products.reduce((s, p) => s + (Number(p.estoque) || 0) * (Number(p.preco) || 0), 0);
    const lucroPotencial = valorVenda - valorCusto;
    const baixoEstoque = products.filter(
      (p) => Number(p.estoqueMinimo) > 0 && Number(p.estoque) <= Number(p.estoqueMinimo)
    ).length;
    return { totalItens, valorCusto, valorVenda, lucroPotencial, baixoEstoque };
  }, [products]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return products;
    return products.filter(
      (p) =>
        p.nome.toLowerCase().includes(q) ||
        (p.tamanho || "").toLowerCase().includes(q) ||
        (p.categoria || "").toLowerCase().includes(q) ||
        (p.campeonato || "").toLowerCase().includes(q) ||
        (p.genero || "").toLowerCase().includes(q) ||
        (p.temporada || "").toLowerCase().includes(q) ||
        (p.versao || "").toLowerCase().includes(q)
    );
  }, [products, search]);

  function openNewProduct() {
    setForm(emptyProduct);
    setModalProduct({});
  }
  function openEditProduct(p) {
    setForm({
      nome: p.nome, tamanho: p.tamanho || "", categoria: p.categoria || "", versao: p.versao || "",
      campeonato: p.campeonato || "", genero: p.genero || "", temporada: p.temporada || "",
      custo: p.custo, preco: p.preco, estoque: p.estoque, estoqueMinimo: p.estoqueMinimo ?? "",
      imagens: Array.isArray(p.imagens) ? p.imagens : [], sobEncomenda: !!p.sobEncomenda,
    });
    setModalProduct(p);
  }
  function closeModal() {
    setModalProduct(null);
    setForm(emptyProduct);
  }

  async function handleAddImage(file) {
    if (!file) return;
    setUploadingImg(true);
    try {
      const dataUrl = await resizeImage(file);
      const res = await gasPost({ action: "uploadImage", base64: dataUrl, mimeType: "image/jpeg", filename: uid() + ".jpg" });
      if (res && res.ok && res.url) {
        setForm((f) => ({ ...f, imagens: [...(f.imagens || []), res.url] }));
      } else {
        showToast("Não consegui salvar a imagem no Drive", "erro");
      }
    } catch (e) {
      showToast("Não foi possível enviar a imagem", "erro");
    }
    setUploadingImg(false);
  }

  function removeImageAt(index) {
    setForm((f) => ({ ...f, imagens: (f.imagens || []).filter((_, i) => i !== index) }));
  }

  async function saveProduct(e) {
    e.preventDefault();
    if (!form.nome.trim()) { showToast("Informe o nome do produto", "erro"); return; }
    const clean = {
      nome: form.nome.trim(),
      tamanho: form.tamanho.trim(),
      categoria: form.categoria.trim(),
      versao: form.versao.trim(),
      campeonato: form.campeonato.trim(),
      genero: form.genero,
      temporada: form.temporada.trim(),
      custo: Number(form.custo) || 0,
      preco: Number(form.preco) || 0,
      estoque: Number(form.estoque) || 0,
      estoqueMinimo: Number(form.estoqueMinimo) || 0,
      imagens: form.imagens || [],
      sobEncomenda: !!form.sobEncomenda,
    };
    const id = modalProduct && modalProduct.id ? modalProduct.id : uid();
    setSyncing(true);
    try {
      const data = productToSheetRow(clean, headersRef.current);
      await gasPost({ id, data });
      showToast(modalProduct && modalProduct.id ? "Produto atualizado" : "Produto cadastrado");
      closeModal();
      await carregarDados(false);
    } catch (err) {
      showToast("Não consegui salvar na planilha", "erro");
    } finally {
      setSyncing(false);
    }
  }

  async function removeProduct(id) {
    setSyncing(true);
    try {
      await gasPost({ action: "delete", id });
      setConfirmDelete(null);
      showToast("Produto removido");
      await carregarDados(false);
    } catch (err) {
      showToast("Não consegui remover na planilha", "erro");
    } finally {
      setSyncing(false);
    }
  }

  function quickAdjust(p, delta) {
    const qty = Math.abs(delta);
    const tipo = delta > 0 ? "entrada" : "saida";
    if (tipo === "saida" && p.estoque <= 0) return;
    registerMovement(p.id, p.nome, tipo, qty, "Ajuste rápido");
  }

  async function registerMovement(produtoId, produtoNome, tipo, quantidade, observacao) {
    const qty = Number(quantidade);
    if (!produtoId || !qty || qty <= 0) { showToast("Selecione o produto e uma quantidade válida", "erro"); return; }
    setSyncing(true);
    try {
      await gasPost({ action: "movement", produtoId, produtoNome, tipo, quantidade: qty, observacao: observacao || "" });
      await carregarDados(false);
    } catch (err) {
      showToast("Não consegui registrar na planilha", "erro");
    } finally {
      setSyncing(false);
    }
  }

  function submitMovement(e) {
    e.preventDefault();
    const produto = products.find((p) => p.id === movForm.produtoId);
    registerMovement(movForm.produtoId, produto?.nome, movForm.tipo, movForm.quantidade, movForm.observacao);
    setMovForm({ produtoId: "", tipo: "entrada", quantidade: "", observacao: "" });
  }

  async function removeMovement(m) {
    setSyncing(true);
    try {
      await gasPost({ action: "deleteMovement", id: m.id });
      showToast("Movimentação removida e estoque revertido");
      await carregarDados(false);
    } catch (err) {
      showToast("Não consegui remover na planilha", "erro");
    } finally {
      setSyncing(false);
    }
  }

  function metaLine(p) {
    return [p.versao, p.campeonato, p.genero, p.temporada].filter(Boolean).join(" · ");
  }

  // No Catálogo (visão do cliente), produtos Sob Encomenda mostram só
  // versão + temporada — o resto (tamanho, campeonato, gênero) não ajuda
  // o cliente a identificar o produto nesse caso.
  function metaLineCatalogo(p) {
    if (p.sobEncomenda) return [p.versao, p.temporada].filter(Boolean).join(" · ");
    return metaLine(p);
  }

  const disponiveis = products.filter((p) => Number(p.estoque) > 0 || p.sobEncomenda);

  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-html2canvas]');
      if (existing) {
        existing.addEventListener("load", resolve);
        existing.addEventListener("error", reject);
        return;
      }
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      script.setAttribute("data-html2canvas", "1");
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function compartilharCatalogoImagem() {
    if (!catalogRef.current || disponiveis.length === 0) return;
    setGerandoImagem(true);
    try {
      await loadHtml2Canvas();
      const canvas = await window.html2canvas(catalogRef.current, {
        backgroundColor: "#0E0C09",
        scale: 2,
        useCORS: true,
      });
      canvas.toBlob(async (blob) => {
        if (!blob) { showToast("Não consegui gerar a imagem", "erro"); setGerandoImagem(false); return; }
        const file = new File([blob], "catalogo-1971-sportswear.png", { type: "image/png" });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Catálogo 1971 Sportswear" });
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "catalogo-1971-sportswear.png";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast("Imagem baixada — já pode enviar pelo WhatsApp");
          }
        } catch (shareErr) {
          // usuário cancelou o compartilhamento — não é erro
        }
        setGerandoImagem(false);
      }, "image/png");
    } catch (e) {
      showToast("Não consegui gerar a imagem do catálogo", "erro");
      setGerandoImagem(false);
    }
  }

  function copiarCatalogo() {
    const linhas = disponiveis.map((p) => {
      const extra = metaLineCatalogo(p);
      const disponibilidade = p.sobEncomenda ? "Sob encomenda" : `${p.estoque} disponível(is)`;
      const tamanhoECategoria = p.sobEncomenda
        ? ""
        : `${p.tamanho ? " (" + p.tamanho + ")" : ""}${p.categoria ? " — " + p.categoria : ""}`;
      return `• ${p.nome}${tamanhoECategoria}${extra ? " — " + extra : ""} — ${BRL(p.preco)} — ${disponibilidade}`;
    });
    const texto = `Produtos disponíveis:\n\n${linhas.join("\n")}`;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(texto).then(
        () => showToast("Catálogo copiado — cole no WhatsApp ou e-mail"),
        () => showToast("Não foi possível copiar", "erro")
      );
    } else {
      showToast("Cópia não suportada neste navegador", "erro");
    }
  }

  function exportarBackup() {
    const payload = {
      app: "controle-estoque-1971-sportswear",
      exportadoEm: new Date().toISOString(),
      products,
      movements,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const data = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `backup-estoque-${data}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Backup exportado");
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {

        const prods = Array.isArray(parsed.products) ? parsed.products : null;

        setImportPending({ products: prods, movements: Array.isArray(parsed.movements) ? parsed.movements : [] });
      } catch (err) {
        showToast("Arquivo de backup inválido", "erro");
      }
    };
    reader.onerror = () => showToast("Não foi possível ler o arquivo", "erro");
    reader.readAsText(file);
  }

          ) : (
            <div className="est-grid">
              {filtered.map((p) => {
                const margem = p.preco > 0 ? ((p.preco - p.custo) / p.preco) * 100 : 0;
                const baixo = Number(p.estoqueMinimo) > 0 && p.estoque <= p.estoqueMinimo;
                return (
                  <div className="est-card" key={p.id}>
                    <div className="est-card-img">
                      {p.imagens && p.imagens[0] ? (
                        <>
                          <img src={p.imagens[0]} alt={p.nome} />
                          {p.imagens.length > 1 && <span className="est-photo-count">+{p.imagens.length - 1}</span>}
                        </>
                      ) : <ImagePlus size={26} />}
                    </div>
                    <div className="est-card-body">
                      <div className="est-card-name">{p.nome}{p.tamanho && <span className="est-size-tag">{p.tamanho}</span>}</div>
                      {p.categoria && <div className="est-card-cat">{p.categoria}</div>}
                      {metaLine(p) && <div className="est-card-meta">{metaLine(p)}</div>}
                      <div className="est-card-row">
                        <span className="est-price">{BRL(p.preco)}</span>
                        <span className="est-margin">{margem.toFixed(0)}% margem</span>
                      </div>
                      <div className="est-card-row">
                        {p.sobEncomenda ? (
                          <span className="est-badge est-badge-encomenda">Sob encomenda</span>
                        ) : (
                          <span className={`est-badge ${baixo ? "est-badge-low" : "est-badge-ok"}`}>
                            {p.estoque} em estoque
                          </span>
                        )}
                        <div className="est-stepper">
                          <button className="est-icon-btn" onClick={() => quickAdjust(p, -1)} title="Registrar saída"><ArrowDownCircle size={15} /></button>
                          <button className="est-icon-btn" onClick={() => quickAdjust(p, 1)} title="Registrar entrada"><ArrowUpCircle size={15} /></button>
                        </div>
                      </div>
                      <div className="est-card-actions">
                        <button className="est-icon-btn" onClick={() => openEditProduct(p)}><Pencil size={14} /></button>
                        <button className="est-icon-btn danger" onClick={() => setConfirmDelete(p)}><Trash2 size={14} /></button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {tab === "movimentos" && (
        <>
          <form className="est-mov-form" onSubmit={submitMovement}>
            <div className="est-field">
              <label>Produto</label>
              <select value={movForm.produtoId} onChange={(e) => setMovForm((f) => ({ ...f, produtoId: e.target.value }))}>
                <option value="">Selecione…</option>
                {products.map((p) => <option key={p.id} value={p.id}>{p.nome}{p.tamanho ? ` (${p.tamanho})` : ""}</option>)}
              </select>
            </div>
            <div className="est-field">
              <label>Tipo</label>
              <div className="est-toggle">
                <button type="button" className={movForm.tipo === "entrada" ? "on entrada" : ""} onClick={() => setMovForm((f) => ({ ...f, tipo: "entrada" }))}>Entrada</button>
                <button type="button" className={movForm.tipo === "saida" ? "on saida" : ""} onClick={() => setMovForm((f) => ({ ...f, tipo: "saida" }))}>Saída</button>
              </div>
            </div>
            <div className="est-field">
              <label>Qtd.</label>
              <input type="number" min="1" value={movForm.quantidade} onChange={(e) => setMovForm((f) => ({ ...f, quantidade: e.target.value }))} />
            </div>
            <div className="est-field">
              <label>Observação</label>
              <input placeholder="Opcional" value={movForm.observacao} onChange={(e) => setMovForm((f) => ({ ...f, observacao: e.target.value }))} />
            </div>
            <button className="est-btn est-btn-primary" type="submit"><Plus size={15} /> Registrar</button>
          </form>

          {movements.length === 0 ? (
            <div className="est-empty"><History size={28} style={{ marginBottom: 8, opacity: 0.5 }} />Nenhuma movimentação registrada.</div>
          ) : (
            <div className="est-history">
              {movements.map((m) => (
                <div className="est-hist-item" key={m.id}>
                  {m.tipo === "entrada" ? <ArrowUpCircle size={16} color="var(--sage)" /> : <ArrowDownCircle size={16} color="var(--danger)" />}
                  <span className="name">{m.produtoNome || productName(m.produtoId)}</span>
                  <span className="meta">{m.tipo === "entrada" ? "+" : "-"}{m.quantidade} un.</span>
                  {m.observacao && <span className="meta">· {m.observacao}</span>}
                  <span className="meta">{m.data ? new Date(m.data).toLocaleString("pt-BR") : ""}</span>
                  <button className="est-icon-btn danger" onClick={() => removeMovement(m)} title="Excluir e reverter"><Trash2 size={13} /></button>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {tab === "catalogo" && (
        <>
          <div className="est-catalog-head">
            <div className="est-sub" style={{ marginTop: 0 }}>{disponiveis.length} produto(s) disponível(is) para envio</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="est-btn est-btn-ghost" onClick={copiarCatalogo}><Copy size={15} /> Copiar lista (texto)</button>
              <button className="est-btn est-btn-primary" onClick={compartilharCatalogoImagem} disabled={gerandoImagem || disponiveis.length === 0}>
                {gerandoImagem ? <Loader2 className="spin" size={15} /> : <Send size={15} />} {gerandoImagem ? "Gerando…" : "Enviar como imagem"}
              </button>
            </div>
          </div>
          {disponiveis.length === 0 ? (
            <div className="est-empty"><ShoppingBag size={28} style={{ marginBottom: 8, opacity: 0.5 }} />Nenhum produto disponível no momento.</div>
          ) : (
            <div className="est-grid" ref={catalogRef}>
              {disponiveis.map((p) => (
                <div className="est-card est-catalog-card" key={p.id}>
                  <div className="est-card-img">
                    {p.imagens && p.imagens[0] ? (
                      <>
                        <img src={p.imagens[0]} alt={p.nome} />
                        {p.imagens.length > 1 && <span className="est-photo-count">+{p.imagens.length - 1}</span>}
                      </>
                    ) : <ImagePlus size={26} />}
                  </div>
                  <div className="est-card-body">
                    <div className="est-card-name">
                      {p.nome}{!p.sobEncomenda && p.tamanho && <span className="est-size-tag">{p.tamanho}</span>}
                    </div>
                    {!p.sobEncomenda && p.categoria && <div className="est-card-cat">{p.categoria}</div>}
                    {metaLineCatalogo(p) && <div className="est-card-meta">{metaLineCatalogo(p)}</div>}
                    <span className="est-price">{BRL(p.preco)}</span>
                    {p.sobEncomenda ? (
                      <span className="est-badge est-badge-encomenda">Sob encomenda</span>
                    ) : (
                      <span className="est-badge est-badge-ok">{p.estoque} disponível(is)</span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {modalProduct !== null && (
        <div className="est-modal-overlay" onClick={closeModal}>
          <div className="est-modal" onClick={(e) => e.stopPropagation()}>
            <h3>{modalProduct.id ? "Editar produto" : "Novo produto"}</h3>
            <form onSubmit={saveProduct}>
              <div className="est-field">
                <label>Fotos do produto</label>
                <div className="est-gallery">
                  {(form.imagens || []).map((url, i) => (
                    <div className="est-gallery-thumb" key={i}>
                      <img src={url} alt="" />
                      <button type="button" className="est-gallery-remove" onClick={() => removeImageAt(i)}><X size={11} /></button>
                    </div>
                  ))}
                  <div className="est-gallery-add" onClick={() => !uploadingImg && fileRef.current?.click()}>
                    {uploadingImg ? <Loader2 className="spin" size={18} /> : <ImagePlus size={18} />}
                    <span>{uploadingImg ? "Enviando…" : "Adicionar"}</span>
                  </div>
                </div>
                <input ref={fileRef} type="file" accept="image/*" hidden onChange={(e) => { handleAddImage(e.target.files?.[0]); e.target.value = ""; }} />
              </div>
              <div className="est-field">
                <label className="est-checkbox-row">
                  <input
                    type="checkbox"
                    checked={!!form.sobEncomenda}
                    onChange={(e) => setForm((f) => ({ ...f, sobEncomenda: e.target.checked }))}
                  />
                  Sob encomenda (sem controle de estoque — só a foto e o preço)
                </label>
              </div>
              <div className="est-field">
                <label>Nome do produto</label>
                <input value={form.nome} onChange={(e) => setForm((f) => ({ ...f, nome: e.target.value }))} placeholder="Ex: S C Corinthians" required />
              </div>
              <div className="est-row2">
                <div className="est-field">
                  <label>Tamanho</label>
                  <input value={form.tamanho} onChange={(e) => setForm((f) => ({ ...f, tamanho: e.target.value }))} placeholder="Ex: G, GG, M…" />
                </div>
                <div className="est-field">
                  <label>Categoria</label>
                  <input value={form.categoria} onChange={(e) => setForm((f) => ({ ...f, categoria: e.target.value }))} placeholder="Ex: Futebol" />
                </div>
              </div>
              <div className="est-row2">
                <div className="est-field">
                  <label>Versão do produto</label>
                  <input value={form.versao} onChange={(e) => setForm((f) => ({ ...f, versao: e.target.value }))} placeholder="Ex: Torcedor / Home" />
                </div>
                <div className="est-field">
                  <label>Campeonato</label>
                  <input value={form.campeonato} onChange={(e) => setForm((f) => ({ ...f, campeonato: e.target.value }))} placeholder="Ex: Brasileirão" />
                </div>
              </div>
              <div className="est-row2">
                <div className="est-field">
                  <label>Gênero</label>
                  <select value={form.genero} onChange={(e) => setForm((f) => ({ ...f, genero: e.target.value }))}>
                    <option value="">Selecione…</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Infantil">Infantil</option>
                    <option value="Unissex">Unissex</option>
                  </select>
                </div>
                <div className="est-field">
                  <label>Temporada</label>
                  <input value={form.temporada} onChange={(e) => setForm((f) => ({ ...f, temporada: e.target.value }))} placeholder="Ex: 2026/27" />
                </div>
              </div>
              <div className="est-row2">
                <div className="est-field">
                  <label>Custo (R$)</label>
                  <input type="number" step="0.01" min="0" value={form.custo} onChange={(e) => setForm((f) => ({ ...f, custo: e.target.value }))} />
                </div>
                <div className="est-field">
                  <label>Preço de venda (R$)</label>
                  <input type="number" step="0.01" min="0" value={form.preco} onChange={(e) => setForm((f) => ({ ...f, preco: e.target.value }))} />
                </div>
              </div>
              {(Number(form.preco) > 0) && (
                <div className="est-derived">
                  Lucro por unidade: <strong>{BRL(Number(form.preco) - Number(form.custo || 0))}</strong>
                  {"  ·  "}Margem: <strong>{(((Number(form.preco) - Number(form.custo || 0)) / Number(form.preco)) * 100).toFixed(1)}%</strong>
                </div>
              )}
              {!form.sobEncomenda && (
                <div className="est-row2">
                  <div className="est-field">
                    <label>Estoque atual</label>
                    <input type="number" min="0" value={form.estoque} onChange={(e) => setForm((f) => ({ ...f, estoque: e.target.value }))} />
                  </div>
                  <div className="est-field">
                    <label>Estoque mínimo</label>
                    <input type="number" min="0" value={form.estoqueMinimo} onChange={(e) => setForm((f) => ({ ...f, estoqueMinimo: e.target.value }))} placeholder="Alerta" />
                  </div>
                </div>
              )}
              <div className="est-modal-actions">
                <button type="button" className="est-btn est-btn-ghost" onClick={closeModal}>Cancelar</button>
                <button type="submit" className="est-btn est-btn-primary" disabled={syncing}><Check size={15} /> Salvar</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {confirmDelete && (
        <div className="est-modal-overlay" onClick={() => setConfirmDelete(null)}>
          <div className="est-modal" style={{ width: 340 }} onClick={(e) => e.stopPropagation()}>
            <h3>Remover produto?</h3>
            <p style={{ fontSize: 14, color: "var(--ink-soft)" }}>
              "{confirmDelete.nome}" será removido da planilha. Essa ação não pode ser desfeita.
            </p>
            <div className="est-modal-actions">
              <button className="est-btn est-btn-ghost" onClick={() => setConfirmDelete(null)}>Cancelar</button>
              <button className="est-btn est-btn-primary" style={{ background: "var(--danger)", color: "#fff" }} onClick={() => removeProduct(confirmDelete.id)}>
                <Trash2 size={15} /> Remover
              </button>
            </div>
          </div>
        </div>
      )}

      {importPending && (
        <div className="est-modal-overlay" onClick={() => setImportPending(null)}>
          <div className="est-modal" style={{ width: 360 }} onClick={(e) => e.stopPropagation()}>
            <h3>Importar backup?</h3>
            <p style={{ fontSize: 14, color: "var(--ink-soft)" }}>
              Este arquivo tem {importPending.products.length} produto(s). Eles serão enviados para a planilha
              (cada um cria ou atualiza uma linha, pelo ID). O histórico de movimentações do backup não é reenviado.
            </p>
            <div className="est-modal-actions">
              <button className="est-btn est-btn-ghost" onClick={() => setImportPending(null)}>Cancelar</button>
              <button className="est-btn est-btn-primary" onClick={confirmarImport} disabled={syncing}>
                <Upload size={15} /> Enviar para a planilha
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div className={`est-toast ${toast.kind === "erro" ? "erro" : ""}`}>
          {toast.kind === "erro" ? <X size={15} /> : <Check size={15} />} {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ControleEstoque />);
</script>

<script>
  (function () {
    var source = document.getElementById("jsx-src").textContent;
    try {
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      (0, eval)(compiled);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div class="boot-error">Erro ao carregar o app:\n' + (err && err.message ? err.message : err) + '</div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
