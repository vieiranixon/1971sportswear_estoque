function normKey(s) {
  return String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

function pickByNorm(rawObj, patterns) {
  const norm = {};
  Object.keys(rawObj).forEach(k => {
    norm[normKey(k)] = rawObj[k];
  });
  for (const p of patterns) {
    if (norm[p] !== undefined) return norm[p];
  }
  const keys = Object.keys(norm);
  for (const p of patterns) {
    const found = keys.find(k => k.startsWith(p));
    if (found !== undefined) return norm[found];
  }

}

// 1400px com qualidade 0.88 dá foto nítida no celular e no zoom do catálogo,
// sem estourar o tamanho do arquivo enviado ao Drive.
// Remove fundo uniforme: parte das bordas e vai "inundando" os pixels
// parecidos. Como só alcança o que está conectado à borda, o branco de
// dentro da camisa (listras, números) nunca é apagado.
function limparFundo(dados, larg, alt, tolerancia = 42) {
  const px = dados;
  const total = larg * alt;

  // cor do fundo = média das quatro bordas
  let r = 0,
    g = 0,
    b = 0,
    n = 0;
  const amostra = (x, y) => {
    const i = (y * larg + x) * 4;
    r += px[i];
    g += px[i + 1];
    b += px[i + 2];
    n++;
  };
  for (let x = 0; x < larg; x += 2) {
    amostra(x, 0);
    amostra(x, alt - 1);
  }
  for (let y = 0; y < alt; y += 2) {
    amostra(0, y);
    amostra(larg - 1, y);
  }
  r /= n;
  g /= n;
  b /= n;

  // fundo escuro provavelmente é foto de ambiente: não mexe
  if (r + g + b < 330) return {
    alterou: false,
    limpos: 0
  };
  const visitado = new Uint8Array(total);
  const fila = new Int32Array(total);
  let ini = 0,
    fim = 0;
  const perto = i => {
    const d = Math.abs(px[i * 4] - r) + Math.abs(px[i * 4 + 1] - g) + Math.abs(px[i * 4 + 2] - b);
    return d < tolerancia * 3;
  };
  for (let x = 0; x < larg; x++) {
    for (const y of [0, alt - 1]) {
      const i = y * larg + x;
      if (!visitado[i] && perto(i)) {
        visitado[i] = 1;
        fila[fim++] = i;
      }
    }
  }
  for (let y = 0; y < alt; y++) {
    for (const x of [0, larg - 1]) {
      const i = y * larg + x;
      if (!visitado[i] && perto(i)) {
        visitado[i] = 1;
        fila[fim++] = i;
      }
    }
  }
  while (ini < fim) {
    const i = fila[ini++];
    const x = i % larg,
      y = i / larg | 0;
    const viz = [];
    if (x > 0) viz.push(i - 1);
    if (x < larg - 1) viz.push(i + 1);
